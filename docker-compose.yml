services:
  api:
    build:
      context: ./maydi_studio/backend-roaster
      dockerfile: Dockerfile
    # Secrets live here (ADMIN_PASSWORD, ADMIN_SESSION_SECRET, OPENAI_API_KEY, …)
    env_file:
      - ./maydi_studio/backend-roaster/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      # Same-origin via nginx — list your public origin(s)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,https://maydi.net}
      # false for local http://localhost:8080; true behind HTTPS
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      DATABASE_PATH: data/maydi.db
      UPLOADS_DIR: data/uploads
      API_PREFIX: /api/v1
    volumes:
      - api_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  api_data:
