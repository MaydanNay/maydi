server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Keep redirects relative so Docker published ports (e.g. :8080) are preserved.
    # Otherwise nginx builds Location with :80 (container port) → browser goes to localhost/studio.
    absolute_redirect off;
    port_in_redirect off;

    # Uploads / roast payloads
    client_max_body_size 30m;

    # Security headers (light)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Cache hashed Vite assets; HTML always revalidated
    location ~* ^/(assets|studio/assets)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # FastAPI (studio admin, projects, leads, roast)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }

    # maydiStudio SPA (Vite base /studio/)
    location = /studio {
        return 301 /studio/;
    }

    location /studio/ {
        try_files $uri $uri/ /studio/index.html;
    }

    # Company site SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
